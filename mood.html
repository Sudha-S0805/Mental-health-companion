<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mood Tracker — Mental Wellness Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header small">
    <div class="container">
      <h1><a href="index.html">← Home</a></h1>
    </div>
  </header>
  <main class="container">
    <h2>How are you feeling today?</h2>
    <div class="mood-form">
      <select id="moodSelect">
        <option value="Happy">Happy</option>
        <option value="Calm">Calm</option>
        <option value="Neutral">Neutral</option>
        <option value="Stressed">Stressed</option>
        <option value="Sad">Sad</option>
        <option value="Anxious">Anxious</option>
      </select>
      <input id="moodNote" placeholder="Optional short note" maxlength="120">
      <button id="saveMoodBtn">Save Mood</button>
    </div>
    <h3>Your mood history</h3>
    <ul id="moodList" class="mood-list"></ul>
    <button id="clearMoods" class="link-btn">Clear All</button>
  </main>
  <script src="main.js"></script>
</body>
</html>
