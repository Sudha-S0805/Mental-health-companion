    <h2>Quick Relaxation Exercises</h2>
    <section class="exercise">
      <h3>4-4-4 Breathing</h3>
      <p>Inhale for 4 seconds → hold 4 seconds → exhale 4 seconds. Repeat 4 times.</p>
      <button id="startBreath">Start 4-4-4 (Demo)</button>
      <div id="breathStatus" class="muted"></div>
    </section>
    <section class="exercise">
      <h3>Guided Video</h3>
      <div class="video-wrap">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/inpok4MKVLM" title="YouTube video" allowfullscreen></iframe>
      </div>
    </section>
